[supervisord]
nodaemon=true
user=root

[program:sssd]
command=/usr/sbin/sssd -i
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cupsd]
command=/usr/sbin/cupsd -f
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Root daemon: polls the cups-pdf spool, archives each PDF to /archive and forwards
# it to the physical printer (cups-pdf's own PostProcessing runs unprivileged).
[program:archiver]
command=/usr/local/bin/archiver.sh
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# Prometheus exporter: parses page_log + /archive + archiver events, serves /metrics.
[program:exporter]
command=/usr/local/bin/cups-exporter.py
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# One-shot: waits for cupsd then declares the real-printer and family-printer queues.
[program:cups-setup]
command=/usr/local/bin/cups-setup.sh
priority=100
autostart=true
autorestart=false
startsecs=0
startretries=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
