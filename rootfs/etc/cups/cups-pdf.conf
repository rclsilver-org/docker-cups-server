# cups-pdf renders each job to PDF in this writable spool (Ghostscript runs as the
# *printing user*, so it cannot write straight to the root-owned /archive dataset).
# The PostProcessing hook (forward.sh, run by cups-pdf as root) then moves the PDF
# into /archive as <user>/<year>/<month>/<day>/ and forwards it to the printer.
Out /var/spool/cups-pdf/${USER}
AnonDirName /var/spool/cups-pdf/anonymous
AnonUser nobody
UserUMask 0027

# keep the job title in the filename (the archiver re-timestamps + renames)
Cut -1
Label 0
TitlePref 1
DecodeHexStrings 1

# No PostProcessing: it runs as the (unprivileged) printing user and so cannot
# write the root-owned /archive nor submit to the internal printer. The root
# archiver daemon (supervisord) picks the rendered PDFs up from the spool instead.
